<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>가채점</title>

<!--
    xlsx-js-style
    Excel 파일에 실제 셀 스타일을 적용하기 위해 사용
-->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

<style>
/* =========================================================
   기본
========================================================= */

:root {
    --primary: #4f46e5;
    --primary-light: #eef2ff;
    --primary-dark: #3730a3;

    --green: #16a34a;
    --green-light: #ecfdf3;

    --red: #dc2626;
    --red-light: #fef2f2;

    --orange: #d97706;
    --orange-light: #fff7ed;

    --text: #18181b;
    --subtext: #71717a;

    --border: #e4e4e7;
    --background: #f7f7f9;
    --card: #ffffff;

    --radius: 14px;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-x: none;

    font-family:
        "Pretendard",
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        "맑은 고딕",
        sans-serif;

    background: var(--background);
    color: var(--text);
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}


/* =========================================================
   앱
========================================================= */

.app {
    min-height: 100vh;
    display: flex;
}


/* =========================================================
   사이드바
========================================================= */

.sidebar {
    width: 250px;
    flex-shrink: 0;

    background: #fff;
    border-right: 1px solid var(--border);

    display: flex;
    flex-direction: column;

    padding: 22px 14px;

    position: sticky;
    top: 0;
    height: 100vh;
}

.logo {
    padding: 4px 10px 22px;

    font-size: 23px;
    font-weight: 900;
    letter-spacing: -1px;
}

.logo-mark {
    display: inline-flex;
    width: 34px;
    height: 34px;

    align-items: center;
    justify-content: center;

    background: var(--primary);
    color: white;

    border-radius: 10px;

    margin-right: 8px;

    font-size: 17px;
}

.logo span {
    color: var(--primary);
}

.sidebar-section-title {
    padding: 0 10px 8px;

    font-size: 12px;
    font-weight: 700;

    color: #a1a1aa;
}

.subject-list {
    flex: 1;

    overflow-y: auto;

    padding-right: 2px;
}

.subject-item {
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border: 0;
    background: transparent;

    padding: 11px 12px;
    margin-bottom: 3px;

    border-radius: 10px;

    color: #52525b;

    text-align: left;
}

.subject-item:hover {
    background: #f4f4f5;
}

.subject-item.active {
    background: var(--primary-light);
    color: var(--primary-dark);
    font-weight: 800;
}

.subject-item-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.subject-item-count {
    min-width: 22px;

    padding: 2px 6px;

    border-radius: 20px;

    background: #f4f4f5;
    color: #71717a;

    font-size: 11px;
    text-align: center;
}

.subject-item.active .subject-item-count {
    background: white;
    color: var(--primary);
}

.add-subject-btn {
    width: 100%;

    padding: 11px 12px;

    border: 1px solid #c7d2fe;
    border-radius: 10px;

    background: var(--primary-light);
    color: var(--primary-dark);

    font-weight: 800;

    margin-top: 10px;
}

.add-subject-btn:hover {
    background: #e0e7ff;
}


/* =========================================================
   메인
========================================================= */

.main {
    flex: 1;
    min-width: 0;

    padding: 30px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 15px;

    margin-bottom: 25px;
}

.page-title {
    margin: 0;

    font-size: 27px;
    font-weight: 900;

    letter-spacing: -1px;
}

.page-subtitle {
    margin-top: 5px;

    color: var(--subtext);
    font-size: 14px;
}

.top-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}


/* =========================================================
   버튼
========================================================= */

.btn {
    min-height: 40px;

    padding: 9px 14px;

    border: 1px solid var(--border);
    border-radius: 9px;

    background: white;
    color: #3f3f46;

    font-weight: 700;

    transition:
        background .15s,
        border-color .15s,
        transform .1s;
}

.btn:hover {
    background: #fafafa;
    border-color: #d4d4d8;
}

.btn:active {
    transform: translateY(1px);
}

/* =========================================================
   백업 복원 파일 선택
   - display:none 대신 실제 input을 버튼 영역 위에 배치
   - 모바일 브라우저/인앱 브라우저의 파일 선택 호환성 향상
========================================================= */

.restore-file-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

.restore-file-btn input[type="file"] {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    opacity: 0;
    cursor: pointer;
    font-size: 0;
}

.restore-file-btn:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79,70,229,.10);
}



.btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
}

.btn-primary:hover {
    background: #4338ca;
    border-color: #4338ca;
}

.btn-danger {
    color: var(--red);
}

.btn-small {
    min-height: 34px;
    padding: 6px 10px;
    font-size: 13px;
}


/* =========================================================
   카드
========================================================= */

.card {
    background: var(--card);

    border: 1px solid var(--border);
    border-radius: var(--radius);

    padding: 22px;

    margin-bottom: 18px;

    box-shadow:
        0 1px 2px rgba(0,0,0,.02);
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 15px;

    margin-bottom: 18px;
}

.card-title {
    font-size: 17px;
    font-weight: 900;
}

.card-description {
    color: var(--subtext);
    font-size: 13px;
    margin-top: 4px;
}


/* =========================================================
   시험 생성
========================================================= */

.exam-create-grid {
    display: grid;

    grid-template-columns:
        minmax(180px, 2fr)
        minmax(130px, 1fr)
        minmax(130px, 1fr)
        minmax(180px, 1.5fr);

    gap: 12px;
}

.field label {
    display: block;

    margin-bottom: 7px;

    font-size: 12px;
    font-weight: 800;

    color: #71717a;
}

.field input,
.field select {
    width: 100%;

    height: 42px;

    padding: 0 11px;

    border: 1px solid #d4d4d8;
    border-radius: 9px;

    background: white;

    outline: none;
}

.field input:focus,
.field select:focus {
    border-color: var(--primary);

    box-shadow:
        0 0 0 3px rgba(79,70,229,.10);
}

.create-actions {
    display: flex;
    justify-content: flex-end;

    margin-top: 15px;
}


/* =========================================================
   통계
========================================================= */

.stats-grid {
    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 12px;

    margin-bottom: 18px;
}

.stat-card {
    background: white;

    border: 1px solid var(--border);
    border-radius: 12px;

    padding: 17px;
}

.stat-label {
    color: #71717a;

    font-size: 12px;
    font-weight: 700;
}

.stat-value {
    margin-top: 7px;

    font-size: 23px;
    font-weight: 900;

    letter-spacing: -.5px;
}

.stat-sub {
    margin-top: 4px;

    color: #a1a1aa;

    font-size: 11px;
}


/* =========================================================
   진행률
========================================================= */

.progress-area {
    margin-top: 16px;
}

.progress-header {
    display: flex;
    justify-content: space-between;

    margin-bottom: 7px;

    font-size: 12px;
    color: #71717a;
}

.progress {
    width: 100%;
    height: 7px;

    background: #e4e4e7;

    border-radius: 20px;

    overflow: hidden;
}

.progress-bar {
    height: 100%;

    background: var(--primary);

    border-radius: 20px;

    transition: width .2s;
}


/* =========================================================
   표
========================================================= */

.table-wrap {
    width: 100%;
    overflow-x: auto;

    border: 1px solid var(--border);
    border-radius: 10px;
}

.score-table {
    width: 100%;

    min-width: 650px;

    border-collapse: collapse;
}

.score-table th {
    background: #fafafa;

    color: #71717a;

    font-size: 12px;
    font-weight: 800;

    white-space: nowrap;
}

.score-table th,
.score-table td {
    padding: 9px 8px;

    border-bottom: 1px solid #eeeeef;

    text-align: center;
}

.score-table tr:last-child td {
    border-bottom: 0;
}

.score-table tbody tr:hover {
    background: #fafafa;
}

.question-number {
    width: 65px;

    font-weight: 800;
}

.table-input,
.table-select {
    width: 100%;

    height: 34px;

    padding: 0 7px;

    border: 1px solid #e4e4e7;
    border-radius: 7px;

    background: white;

    text-align: center;

    outline: none;
}

.table-input:focus,
.table-select:focus {
    border-color: var(--primary);

    box-shadow:
        0 0 0 2px rgba(79,70,229,.08);
}

.result-badge {
    display: inline-flex;

    min-width: 30px;
    height: 27px;

    padding: 0 8px;

    align-items: center;
    justify-content: center;

    border-radius: 7px;

    font-size: 12px;
    font-weight: 900;
}

.result-correct {
    background: var(--green-light);
    color: var(--green);
}

.result-wrong {
    background: var(--red-light);
    color: var(--red);
}

.result-partial {
    background: var(--orange-light);
    color: var(--orange);
}

.result-empty {
    background: #f4f4f5;
    color: #a1a1aa;
}


/* =========================================================
   시험 목록
========================================================= */

.exam-list {
    display: flex;
    flex-direction: column;
}

.exam-row {
    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 15px;

    padding: 15px 3px;

    border-bottom: 1px solid #eeeeef;
}

.exam-row:last-child {
    border-bottom: 0;
}

.exam-name {
    font-weight: 800;
}

.exam-meta {
    margin-top: 4px;

    color: #a1a1aa;

    font-size: 12px;
}

.exam-actions {
    display: flex;
    gap: 6px;
}


/* =========================================================
   빈 상태
========================================================= */

.empty-state {
    text-align: center;

    padding: 75px 20px;
}

.empty-icon {
    width: 58px;
    height: 58px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin: 0 auto 15px;

    background: var(--primary-light);
    color: var(--primary);

    border-radius: 16px;

    font-size: 24px;
}

.empty-state h2 {
    margin: 0;

    font-size: 19px;
}

.empty-state p {
    color: #71717a;

    font-size: 13px;

    line-height: 1.7;

    margin: 8px 0 18px;
}


/* =========================================================
   시험 헤더
========================================================= */

.exam-header {
    display: flex;

    justify-content: space-between;
    align-items: flex-start;

    gap: 20px;
}

.exam-title {
    font-size: 22px;
    font-weight: 900;
}

.exam-info {
    margin-top: 6px;

    color: #71717a;

    font-size: 13px;
}

.exam-header-actions {
    display: flex;

    gap: 7px;

    flex-wrap: wrap;
}


/* =========================================================
   안내
========================================================= */

.notice {
    display: flex;

    gap: 10px;

    padding: 12px 14px;

    background: var(--primary-light);

    color: #4338ca;

    border-radius: 9px;

    font-size: 13px;

    line-height: 1.5;

    margin-bottom: 16px;
}


/* =========================================================
   모달
========================================================= */

.modal-overlay {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(24,24,27,.45);

    padding: 20px;

    z-index: 1000;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    width: 420px;
    max-width: 100%;

    background: white;

    border-radius: 16px;

    padding: 24px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.2);
}

.modal h2 {
    margin: 0 0 7px;

    font-size: 20px;
}

.modal-description {
    color: #71717a;

    font-size: 13px;

    margin-bottom: 18px;
}

.modal-actions {
    display: flex;

    justify-content: flex-end;

    gap: 8px;

    margin-top: 18px;
}


/* =========================================================
   Toast
========================================================= */

.toast-container {
    position: fixed;

    right: 20px;
    bottom: 20px;

    display: flex;

    flex-direction: column;

    gap: 8px;

    z-index: 2000;
}

.toast {
    padding: 12px 15px;

    background: #18181b;
    color: white;

    border-radius: 9px;

    font-size: 13px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.2);

    animation:
        toast-in .2s ease;
}

@keyframes toast-in {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================================
   반응형
========================================================= */

@media (max-width: 1000px) {

    .sidebar {
        width: 210px;
    }

    .main {
        padding: 22px;
    }

    .exam-create-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 750px) {

    .app {
        display: block;
    }

    .sidebar {
        position: static;

        width: 100%;
        height: auto;

        border-right: 0;
        border-bottom: 1px solid var(--border);

        padding: 15px;
    }

    .logo {
        padding-bottom: 15px;
    }

    .subject-list {
        max-height: 150px;
    }

    .main {
        padding: 15px;
    }

    .topbar {
        display: block;
    }

    .top-actions {
        margin-top: 15px;
    }

    .stats-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .exam-header {
        display: block;
    }

    .exam-header-actions {
        margin-top: 15px;
    }
}

@media (max-width: 500px) {

    .exam-create-grid {
        grid-template-columns: 1fr;
    }

    .stats-grid {
        grid-template-columns: 1fr 1fr;
    }

    .card {
        padding: 16px;
    }
}
</style>
</head>


<body>

<div class="app">

    <!-- =====================================================
         사이드바
    ====================================================== -->

    <aside class="sidebar">

        <div class="logo">
            <span class="logo-mark">✓</span>
            가<span>채점</span>
        </div>

        <div class="sidebar-section-title">
            과목
        </div>

        <div
            id="subjectList"
            class="subject-list"
        ></div>

        <button
            class="add-subject-btn"
            onclick="openSubjectModal()"
        >
            ＋ 과목 추가
        </button>

    </aside>


    <!-- =====================================================
         메인
    ====================================================== -->

    <main class="main">

        <div class="topbar">

            <div>
                <h1
                    id="pageTitle"
                    class="page-title"
                >
                    가채점
                </h1>

                <div
                    id="pageSubtitle"
                    class="page-subtitle"
                >
                    시험 결과를 빠르게 기록하고 관리하세요.
                </div>
            </div>


            <div class="top-actions">

                <button
                    class="btn"
                    onclick="exportBackup()"
                >
                    백업
                </button>

                <label class="btn restore-file-btn">
                    복원
                    <input
                        id="importFile"
                        type="file"
                        accept=".json,application/json"
                        onchange="importBackup(event)"
                    >
                </label>

                <button
                    class="btn btn-primary"
                    onclick="exportExcel()"
                >
                    Excel 내보내기
                </button>



            </div>

        </div>


        <div id="content"></div>

    </main>

</div>


<!-- =========================================================
     과목 추가 모달
========================================================= -->

<div
    id="subjectModal"
    class="modal-overlay"
>

    <div class="modal">

        <h2>과목 추가</h2>

        <div class="modal-description">
            가채점할 과목을 추가하세요.
        </div>

        <div class="field">

            <label>과목명</label>

            <input
                id="subjectName"
                type="text"
                placeholder="예: 국어"
                onkeydown="
                    if(event.key === 'Enter') {
                        addSubject();
                    }
                "
            >

        </div>

        <div class="modal-actions">

            <button
                class="btn"
                onclick="closeSubjectModal()"
            >
                취소
            </button>

            <button
                class="btn btn-primary"
                onclick="addSubject()"
            >
                추가
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     Toast
========================================================= -->

<div
    id="toastContainer"
    class="toast-container"
></div>


<script>
/* =========================================================
   저장 데이터
========================================================= */

const STORAGE_KEY = "gachaejeom_data_v2";

let data = loadData();

let currentSubjectId = null;
let currentExamId = null;


/* =========================================================
   데이터 초기화
========================================================= */

function loadData() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (!saved) {
            return {
                version: 2,
                subjects: []
            };
        }

        const parsed =
            JSON.parse(saved);

        if (!Array.isArray(parsed.subjects)) {
            parsed.subjects = [];
        }

        return parsed;

    } catch (error) {

        console.error(error);

        return {
            version: 2,
            subjects: []
        };
    }
}


function saveData() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(data)
        );

        return true;

    } catch (error) {

        console.error("데이터 저장 실패:", error);

        showToast(
            "데이터 저장에 실패했습니다. 저장 공간을 확인해주세요."
        );

        return false;
    }
}


/* =========================================================
   ID
========================================================= */

function createId() {

    return (
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .substring(2, 8)
    );
}


/* =========================================================
   현재 데이터
========================================================= */

function getCurrentSubject() {

    return data.subjects.find(
        subject =>
            subject.id === currentSubjectId
    );
}


function getCurrentExam() {

    const subject =
        getCurrentSubject();

    if (!subject) {
        return null;
    }

    return subject.exams.find(
        exam =>
            exam.id === currentExamId
    );
}


/* =========================================================
   Toast
========================================================= */

function showToast(message) {

    const container =
        document.getElementById(
            "toastContainer"
        );

    const toast =
        document.createElement("div");

    toast.className = "toast";

    toast.textContent = message;

    container.appendChild(toast);

    setTimeout(() => {

        toast.remove();

    }, 2200);
}


/* =========================================================
   사이드바
========================================================= */

function renderSubjects() {

    const list =
        document.getElementById(
            "subjectList"
        );

    list.innerHTML = "";

    if (data.subjects.length === 0) {

        list.innerHTML = `
            <div style="
                padding:10px;
                color:#a1a1aa;
                font-size:12px;
            ">
                아직 과목이 없습니다.
            </div>
        `;

        return;
    }


    data.subjects.forEach(subject => {

        const button =
            document.createElement("button");

        button.className =
            "subject-item " +
            (
                subject.id === currentSubjectId
                    ? "active"
                    : ""
            );


        button.innerHTML = `
            <span class="subject-item-name">
                ${escapeHtml(subject.name)}
            </span>

            <span class="subject-item-count">
                ${subject.exams.length}
            </span>
        `;


        button.onclick = () => {

            currentSubjectId =
                subject.id;

            currentExamId = null;

            renderSubjects();
            renderContent();
        };


        list.appendChild(button);

    });
}


/* =========================================================
   과목 추가
========================================================= */

function openSubjectModal() {

    document
        .getElementById("subjectModal")
        .classList.add("show");

    setTimeout(() => {

        document
            .getElementById("subjectName")
            .focus();

    }, 50);
}


function closeSubjectModal() {

    document
        .getElementById("subjectModal")
        .classList.remove("show");

    document
        .getElementById("subjectName")
        .value = "";
}


function addSubject() {

    const input =
        document.getElementById(
            "subjectName"
        );

    const name =
        input.value.trim();

    if (!name) {

        showToast("과목명을 입력해주세요.");

        input.focus();

        return;
    }


    if (
        data.subjects.some(
            subject =>
                subject.name === name
        )
    ) {

        showToast("이미 존재하는 과목입니다.");

        return;
    }


    const subject = {

        id: createId(),

        name,

        exams: []

    };


    data.subjects.push(subject);

    currentSubjectId =
        subject.id;

    currentExamId = null;

    saveData();

    closeSubjectModal();

    renderSubjects();
    renderContent();

    showToast(
        `"${name}" 과목을 추가했습니다.`
    );
}

========================================================= */

function createExam() {

    const subject =
        getCurrentSubject();

    if (!subject) {
        return;
    }


    const name =
        document
            .getElementById("examName")
            .value
            .trim() ||
        "새 시험";


    const objectiveCount =
        Math.max(
            0,
            parseInt(
                document
                    .getElementById(
                        "objectiveCount"
                    )
                    .value
            ) || 0
        );


    const subjectiveCount =
        Math.max(
            0,
            parseInt(
                document
                    .getElementById(
                        "subjectiveCount"
                    )
                    .value
            ) || 0
        );


    const studentName =
        document
            .getElementById("studentName")
            .value
            .trim();


    if (
        objectiveCount +
        subjectiveCount ===
        0
    ) {

        showToast(
            "문항 수를 하나 이상 입력해주세요."
        );

        return;
    }


    const exam = {

        id: createId(),

        name,

        studentName,

        createdAt:
            new Date().toISOString(),

        objective: [],

        subjective: []

    };


    for (
        let i = 1;
        i <= objectiveCount;
        i++
    ) {

        exam.objective.push({

            number: i,

            answer: "",

            studentAnswer: "",

            points: 0

        });

    }


    for (
        let i = 1;
        i <= subjectiveCount;
        i++
    ) {

        exam.subjective.push({

            number:
                objectiveCount + i,

            result: "",

            points: 0,

            score: 0

        });

    }


    subject.exams.push(exam);

    currentExamId =
        exam.id;


    saveData();

    renderSubjects();
    renderContent();

    showToast(
        "채점표를 생성했습니다."
    );
}

function deleteExam(id) {

    const subject =

    if (!subject) {
        return;
    }


    const exam =
        subject.exams.find(
            item =>
                item.id === id
        );


    if (!exam) {
        return;
    }


    if (
        !confirm(
            `"${exam.name}" 시험을 삭제할까요?`
        )
    ) {
        return;
    }


    subject.exams =
        subject.exams.filter(
            item =>
                item.id !== id
        );


    currentExamId = null;

    saveData();

    renderSubjects();
    renderContent();

    showToast(
        "시험을 삭제했습니다."
    );
}

function renderObjectiveRow(
    q,
    index
) {

    const answer =
        normalizeAnswer(q.answer);

    const student =
        normalizeAnswer(q.studentAnswer);


    const hasBoth =
        answer !== "" &&
        student !== "";


    const correct =
        hasBoth &&
        answer === student;


    const earned =
        correct
            ? Number(q.points) || 0
            : 0;


    let badgeClass =
        "result-empty";

    let badgeText =
        "-";


    if (hasBoth) {

        if (correct) {

            badgeClass =
                "result-correct";

            badgeText =
                "O";

        } else {

            badgeClass =
                "result-wrong";

            badgeText =
                "X";
        }
    }


    return `

        <tr>

            <td class="question-number">
                ${q.number}
            </td>


            <td>

                <input
                    class="table-input"
                    value="${escapeAttr(q.answer)}"
                    placeholder="③"
                    onchange="
                        updateObjective(
                            ${index},
                            'answer',
                            this.value
                        )
                    "
                >

            </td>


            <td>

                <input
                    class="table-input"
                    value="${escapeAttr(q.studentAnswer)}"
                    placeholder="③"
                    onchange="
                        updateObjective(
                            ${index},
                            'studentAnswer',
                            this.value
                        )
                    "
                >

            <td>

                    class="table-input"
                    type="number"
                    min="0"
                    step="0.01"
                    value="${q.points}"
                    onchange="
                        updateObjective(
                            ${index},
                            'points',
                            this.value
                        )
                    "
                >

            </td>


            <td>

                <span
                    class="result-badge ${badgeClass}"
                >
                    ${badgeText}
                </span>

            </td>


            <td>
                <strong>
                    ${formatNumber(earned)}
                </strong>
            </td>

        </tr>
    `;
}

/* =========================================================
   데이터 수정
========================================================= */

function updateObjective(
    index,
    field,
    value
) {

    const exam =
        getCurrentExam();

    if (!exam) {
        return;
    }


    if (field === "points") {

        value =
            Math.max(
                0,
                Number(value) || 0
            );
    }


    exam.objective[index][field] =
        value;


    saveData();

    renderExam(
        exam,
        document.getElementById(
            "content"
        )
    );
}


function updateSubjective(
    index,
    field,
    value
) {

    const exam =
        getCurrentExam();

    if (!exam) {
        return;
    }


    if (
        field === "points" ||
        field === "score"
    ) {

        value =
            Math.max(
                0,
                Number(value) || 0
            );
    }


    exam.subjective[index][field] =
        value;


    saveData();

    renderExam(
        exam,
        document.getElementById(
            "content"
        )
    );
}


/* =========================================================
   계산
========================================================= */

function calculateExam(exam) {

    let objectiveScore = 0;
    let objectivePossible = 0;


    exam.objective.forEach(q => {

        const answer =
            normalizeAnswer(
                q.answer
            );

        const student =
            normalizeAnswer(
                q.studentAnswer
            );

        const points =
            Number(q.points) || 0;


        objectivePossible +=
            points;


        if (
            answer !== "" &&
            student !== "" &&
            answer === student
        ) {

            objectiveScore +=
                points;
        }

    });


    let subjectiveScore = 0;
    let subjectivePossible = 0;


    exam.subjective.forEach(q => {

        subjectivePossible +=
            Number(q.points) || 0;

        subjectiveScore +=
            Number(q.score) || 0;

    });


    const totalScore =
        objectiveScore +
        subjectiveScore;


    const totalPossible =
        objectivePossible +
        subjectivePossible;


    const percent =
        totalPossible > 0
            ? Math.round(
                totalScore /
                totalPossible *
                10000
            ) / 100
            : 0;


    return {

        objectiveScore,

        objectivePossible,

        subjectiveScore,

        subjectivePossible,

        totalScore,

        totalPossible,

        percent
    };
}


/* =========================================================
   정답 정규화
========================================================= */

function normalizeAnswer(value) {

    return String(value || "")
        .trim()
        .replace(/\s+/g, "")
        .replace(/①/g, "1")
        .replace(/②/g, "2")
        .replace(/③/g, "3")
        .replace(/④/g, "4")
        .replace(/⑤/g, "5")
        .toLowerCase();
}

/* =========================================================
   JSON 복원
========================================================= */

function importBackup(event) {

    const input =
        event &&
        event.target;

    const file =
        input &&
        input.files &&
        input.files[0];

    if (!file) {
        return;
    }

    /*
        모바일 브라우저에서 같은 파일을 다시 선택해도
        change 이벤트가 발생하도록 마지막에 반드시 초기화한다.
    */
    const resetInput = () => {
        try {
            input.value = "";
        } catch (error) {
            console.warn("파일 입력 초기화 실패:", error);
        }
    };

    /*
        백업 파일은 JSON이므로 지나치게 큰 파일은 미리 차단한다.
        정상적인 가채점 데이터는 이보다 훨씬 작다.
    */
    const MAX_BACKUP_SIZE = 10 * 1024 * 1024;

    if (file.size > MAX_BACKUP_SIZE) {

        alert(
            "백업 파일이 너무 큽니다.\n" +
            "10MB 이하의 가채점 백업 파일만 복원할 수 있습니다."
        );

        resetInput();
        return;
    }

    const reader = new FileReader();

    reader.onerror = function() {

        console.error("백업 파일 읽기 실패:", reader.error);

        alert(
            "백업 파일을 읽지 못했습니다.\n" +
            "파일이 손상되었거나 브라우저에서 파일 접근을 차단했을 수 있습니다."
        );

        resetInput();
    };

    reader.onabort = function() {

        alert("백업 파일 읽기가 취소되었습니다.");

        resetInput();
    };

    reader.onload = function(e) {

        try {

            const rawText =
                typeof e.target.result === "string"
                    ? e.target.result
                    : "";

            if (!rawText.trim()) {
                throw new Error("Empty backup file");
            }

            let imported;

            try {

                imported =
                    JSON.parse(rawText);

            } catch (parseError) {

                throw new Error(
                    "JSON 형식이 올바르지 않습니다."
                );
            }

            /*
                백업 데이터 구조를 엄격하게 확인한다.
                잘못된 JSON을 그대로 data에 넣어 앱이 망가지는 것을 방지한다.
            */
            if (
                !imported ||
                typeof imported !== "object" ||
                !Array.isArray(imported.subjects)
            ) {

                throw new Error(
                    "subjects 배열이 없습니다."
                );
            }

            const normalizedSubjects =
                imported.subjects.map(
                    (subject, subjectIndex) => {

                        if (
                            !subject ||
                            typeof subject !== "object"
                        ) {
                            throw new Error(
                                `과목 ${subjectIndex + 1}의 형식이 올바르지 않습니다.`
                            );
                        }

                        const subjectName =
                            typeof subject.name === "string"
                                ? subject.name.trim()
                                : "";

                        if (!subjectName) {
                            throw new Error(
                                `과목 ${subjectIndex + 1}의 이름이 없습니다.`
                            );
                        }

                        if (!Array.isArray(subject.exams)) {
                            throw new Error(
                                `"${subjectName}" 과목의 시험 데이터가 올바르지 않습니다.`
                            );
                        }

                        return {
                            ...subject,
                            id:
                                subject.id ||
                                createId(),
                            name:
                                subjectName,
                            exams:
                                subject.exams.map(
                                    (exam, examIndex) => {

                                        if (
                                            !exam ||
                                            typeof exam !== "object"
                                        ) {
                                            throw new Error(
                                                `"${subjectName}"의 시험 ${examIndex + 1} 형식이 올바르지 않습니다.`
                                            );
                                        }

                                        return {
                                            ...exam,
                                            id:
                                                exam.id ||
                                                createId()
                                        };
                                    }
                                )
                        };
                    }
                );

            const importedData = {
                ...imported,
                version: 2,
                subjects: normalizedSubjects
            };

            /*
                현재 데이터가 실제로 존재할 때만 확인창을 표시한다.
                빈 앱에서는 바로 복원한다.
            */
            const hasCurrentData =
                Array.isArray(data.subjects) &&
                data.subjects.length > 0;

            let replace = true;

            if (hasCurrentData) {

                replace =
                    confirm(
                        "현재 데이터를 모두 교체할까요?\n\n" +
                        "확인: 백업 데이터로 교체\n" +
                        "취소: 현재 데이터에 추가"
                    );
            }

            /*
                복원 작업 전 기존 데이터를 깊게 복사한다.
                저장 실패가 발생하면 원래 데이터를 되돌릴 수 있다.
            */
            const previousData =
                JSON.parse(
                    JSON.stringify(data)
                );

            if (replace) {

                data =
                    importedData;

            } else {

                if (!Array.isArray(data.subjects)) {
                    data.subjects = [];
                }

                importedData.subjects.forEach(
                    importedSubject => {

                        const existing =
                            data.subjects.find(
                                subject =>
                                    subject.name ===
                                    importedSubject.name
                            );

                        if (existing) {

                            if (!Array.isArray(existing.exams)) {
                                existing.exams = [];
                            }

                            existing.exams.push(
                                ...(importedSubject.exams || [])
                            );

                        } else {

                            data.subjects.push(
                                importedSubject
                            );
                        }
                    }
                );
            }

            /*
                저장까지 성공한 경우에만 화면을 갱신한다.
                저장 실패 시 기존 데이터로 복구한다.
            */
            if (!saveData()) {

                data =
                    previousData;

                throw new Error(
                    "복원 데이터 저장에 실패했습니다."
                );
            }

            currentSubjectId = null;
            currentExamId = null;

            renderSubjects();
            renderContent();

            showToast(
                replace
                    ? "백업 데이터를 복원했습니다."
                    : "백업 데이터를 현재 데이터에 추가했습니다."
            );

        } catch (error) {

            console.error(
                "백업 복원 실패:",
                error
            );

            alert(
                "백업 파일을 복원하지 못했습니다.\n\n" +
                (
                    error &&
                    error.message
                        ? error.message
                        : "올바른 가채점 백업 파일이 아닙니다."
                )
            );

        } finally {

            resetInput();
        }
    };

    try {

        reader.readAsText(
            file,
            "UTF-8"
        );

    } catch (error) {

        console.error(
            "백업 파일 읽기 시작 실패:",
            error
        );

        alert(
            "백업 파일을 읽을 수 없습니다.\n" +
            "Chrome 또는 Samsung Internet에서 다시 시도해주세요."
        );

        resetInput();
    }
}


/* =========================================================
   Excel 공통 데이터 생성
========================================================= */

function buildSubjectRows(subject) {

    const rows = [];


    subject.exams.forEach(
        (exam, examIndex) => {

            const score =
                calculateExam(exam);


            rows.push({
                type: "title",
                values: [
                    `${subject.name} · ${exam.name}`
                ]
            });


            rows.push({
                type: "info",
                values: [
                    "학생명",
                    exam.studentName || "미입력",
                    "",
                    "작성일",
                    formatDate(exam.createdAt)
                ]
            });


            rows.push({
                type: "blank",
                values: []
            });


            rows.push({
                type: "section",
                values: [
                    "객관식"
                ]
            });


            rows.push({
                type: "header",
                values: [
                    "문항",
                    "유형",
                    "정답",
                    "학생 정답",
                    "정오",
                    "배점",
                    "득점"
                ]
            });


            exam.objective.forEach(q => {

                const answer =
                    normalizeAnswer(
                        q.answer
                    );

                const student =
                    normalizeAnswer(
                        q.studentAnswer
                    );


                const answered =
                    answer !== "" &&
                    student !== "";


                const correct =
                    answered &&
                    answer === student;


                rows.push({
                    type: correct
                        ? "correct"
                        : answered
                            ? "wrong"
                            : "normal",

                    values: [
                        q.number,
                        "객관식",
                        q.answer || "",
                        q.studentAnswer || "",
                        answered
                            ? correct
                                ? "O"
                                : "X"
                            : "",
                        Number(q.points) || 0,
                        correct
                            ? Number(q.points) || 0
                            : 0
                    ]
                });

            });


            if (exam.subjective.length) {

                rows.push({
                    type: "blank",
                    values: []
                });


                rows.push({
                    type: "section",
                    values: [
                        "서·논술형"
                    ]
                });


                rows.push({
                    type: "header",
                    values: [
                        "문항",
                        "유형",
                        "정답",
                        "학생 정답",
                        "정오",
                        "배점",
                        "득점"
                    ]
                });


                exam.subjective.forEach(q => {

                    rows.push({
                        type:
                            q.result === "O"
                                ? "correct"
                                : q.result === "X"
                                    ? "wrong"
                                    : q.result === "부분정답"
                                        ? "partial"
                                        : "normal",

                        values: [
                            q.number,
                            "서·논술형",
                            "",
                            "",
                            q.result || "",
                            Number(q.points) || 0,
                            Number(q.score) || 0
                        ]
                    });

                });
            }


            rows.push({
                type: "blank",
                values: []
            });


            rows.push({
                type: "summary",
                values: [
                    "객관식",
                    "",
                    "",
                    "",
                    "",
                    score.objectivePossible,
                    score.objectiveScore
                ]
            });


            rows.push({
                type: "summary",
                values: [
                    "서·논술형",
                    "",
                    "",
                    "",
                    "",
                    score.subjectivePossible,
                    score.subjectiveScore
                ]
            });


            rows.push({
                type: "total",
                values: [
                    "총점",
                    "",
                    "",
                    "",
                    "",
                    score.totalPossible,
                    score.totalScore
                ]
            });


            rows.push({
                type: "percent",
                values: [
                    "획득률",
                    "",
                    "",
                    "",
                    "",
                    "",
                    `${score.percent}%`
                ]
            });


            if (
                examIndex <
                subject.exams.length - 1
            ) {

                rows.push({
                    type: "separator",
                    values: []
                });

                rows.push({
                    type: "separator",
                    values: []
                });
            }

        }
    );


    return rows;
}


/* =========================================================
   Excel 내보내기
========================================================= */

function exportExcel() {

    if (
        typeof XLSX ===
        "undefined"
    ) {

        alert(
            "Excel 라이브러리를 불러오지 못했습니다.\n" +
            "인터넷 연결을 확인해주세요."
        );

        return;
    }


    if (
        data.subjects.length === 0
    ) {

        showToast(
            "내보낼 과목이 없습니다."
        );

        return;
    }


    const workbook =
        XLSX.utils.book_new();


    data.subjects.forEach(
        subject => {

            const rows =
                buildSubjectRows(
                    subject
                );


            const worksheet =
                createStyledWorksheet(
                    rows
                );


            XLSX.utils.book_append_sheet(
                workbook,
                worksheet,
                safeSheetName(
                    subject.name
                )
            );
        }
    );


    XLSX.writeFile(
        workbook,
        "가채점_결과.xlsx"
    );


    showToast(
        "Excel 파일을 생성했습니다."
    );
}

/* =========================================================
   Excel Worksheet 생성
========================================================= */

function createStyledWorksheet(rows) {

    const values =
        rows.map(
            row =>
                row.values
        );


    const worksheet =
        XLSX.utils.aoa_to_sheet(
            values
        );


    /*
     * 열 너비
     */
    worksheet["!cols"] = [

        { wch: 8 },   // 문항

        { wch: 14 },  // 유형

        { wch: 14 },  // 정답

        { wch: 14 },  // 학생 정답

        { wch: 10 },  // 정오

        { wch: 10 },  // 배점

        { wch: 10 }   // 득점
    ];


    /*
     * 기본 폰트 / 정렬
     */
    const range =
        XLSX.utils.decode_range(
            worksheet["!ref"]
        );


    for (
        let r = range.s.r;
        r <= range.e.r;
        r++
    ) {

        for (
            let c = range.s.c;
            c <= range.e.c;
            c++
        ) {

            const address =
                XLSX.utils.encode_cell({
                    r,
                    c
                });


            if (!worksheet[address]) {

                worksheet[address] = {
                    v: "",
                    t: "s"
                };
            }


            worksheet[address].s = {

                font: {
                    name: "맑은 고딕",
                    sz: 10,
                    color: "222222"
                },

                alignment: {
                    horizontal: "center",
                    vertical: "center",
                    wrapText: true
                },

                border: {
                    top: {
                        style: "thin",
                        color: {
                            rgb: "E5E7EB"
                        }
                    },

                    bottom: {
                        style: "thin",
                        color: {
                            rgb: "E5E7EB"
                        }
                    },

                    left: {
                        style: "thin",
                        color: {
                            rgb: "E5E7EB"
                        }
                    },

                    right: {
                        style: "thin",
                        color: {
                            rgb: "E5E7EB"
                        }
                    }

    }


    /*

        (row, rowIndex) => {

            const excelRow =

                                bold: true,
                                color: "FFFFFF"
                            },

                                fgColor: {
                                    rgb: "4F46E5"
                                }
                            },

                                horizontal: "center",
                                vertical: "center"
                            }
                        }

                        e: {
                            r: rowIndex,
                            c: 6
                        }
                    });

                    break;


                case "info":

                    styleRow(

                        excelRow,
                        7,
                        {
                            font: {

                                sz: 10,

                                fgColor: {
                                    rgb: "EEF2FF"
                                }
                            },

                                bold: true,
                                color: "3730A3"
                            }
                        }
                    );

                    break;


                case "separator":

                    break;
            }

        }
    );

     * 행 높이

    rows.forEach(
        row => {

            if (row.type === "title") {
                height = 30;
            }

            if (row.type === "section") {
                height = 23;
            }

            if (row.type === "header") {
                height = 24;
            }

            worksheet["!rows"].push({
                hpt: height
            });

        }
    );


    /*
     * 인쇄 설정
     *
     * A4 / 가로 / 한 페이지에 맞춤
     */

        orientation: "landscape",

        fitToWidth: 1,

        fitToHeight: 1
    };


    worksheet["!sheetPr"] = {

        pageSetUpPr: {
            fitToPage: true
        }
    };


    worksheet["!margins"] = {

        left: 0.25,

        right: 0.25,

        top: 0.45,

        bottom: 0.45,

        header: 0.2,

        footer: 0.2
    };


    worksheet["!printOptions"] = {

        horizontalCentered: true,

        verticalCentered: false,

        gridLines: false
    };


    /*
     * 인쇄 영역
     */
    worksheet["!printArea"] =
        worksheet["!ref"];


    return worksheet;
}


/* =========================================================
   Excel 스타일 도우미
========================================================= */

function styleRow(
    worksheet,
    rowNumber,
    columnCount,
    style
) {

    for (
        let c = 0;
        c < columnCount;
        c++
    ) {

        const address =
            XLSX.utils.encode_cell({
                r: rowNumber - 1,
                c
            });


        if (!worksheet[address]) {

            worksheet[address] = {
                v: "",
                t: "s"
            };
        }


        worksheet[address].s = mergeStyles(
            worksheet[address].s || {},
            style
        );
    }
}


function styleCell(
    worksheet,
    rowNumber,
    columnNumber,
    style
) {

    const address =
        XLSX.utils.encode_cell({
            r: rowNumber - 1,
            c: columnNumber
        });


    if (!worksheet[address]) {

        worksheet[address] = {
            v: "",
            t: "s"
        };
    }


    worksheet[address].s =
        mergeStyles(
            worksheet[address].s || {},
            style
        );
}


function mergeStyles(
    base,
    extra
) {

    return {

        ...base,

        ...extra,

        font: {
            ...(base.font || {}),
            ...(extra.font || {})
        },

        fill: {
            ...(base.fill || {}),
            ...(extra.fill || {})
        },

        alignment: {
            ...(base.alignment || {}),
            ...(extra.alignment || {})
        },

        border: {
            ...(base.border || {}),
            ...(extra.border || {})
        }
    };
}


/* =========================================================
   Excel Sheet 이름
========================================================= */

function safeSheetName(name) {

    let result =
        String(name)
            .replace(
                /[\\\/\?\*\[\]\:]/g,
                "_"
            )
            .substring(
                0,
                31
            );


    return result || "과목";
}


/* =========================================================
   다운로드
========================================================= */

function downloadBlob(
    content,
    filename,
    type
) {

    const blob =
        new Blob(
            [content],
            { type }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href = url;

    link.download =
        filename;


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );
}


/* =========================================================
   유틸리티
========================================================= */

function formatNumber(value) {

    const number =
        Number(value) || 0;


    return Number.isInteger(number)
        ? String(number)
        : number.toFixed(2)
            .replace(/0+$/, "")
            .replace(/\.$/, "");
}


function formatDate(value) {

    if (!value) {
        return "";
    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return "";
    }


    return (
        date.getFullYear() +
        "." +
        String(
            date.getMonth() + 1
        ).padStart(2, "0") +
        "." +
        String(
            date.getDate()
        ).padStart(2, "0")
    );
}


function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


function escapeAttr(value) {

    return escapeHtml(value);
}

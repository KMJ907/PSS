<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가채점</title>

<!-- Excel(.xlsx) 생성 -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    background: #f5f7fb;
    color: #202124;
}

button,
input,
select {
    font: inherit;
}

button {
    border: 0;
    cursor: pointer;
}

.app {
    min-height: 100vh;
    display: flex;
}

/* 사이드바 */
.sidebar {
    width: 240px;
    background: #ffffff;
    border-right: 1px solid #e5e7eb;
    padding: 22px 16px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 24px;
}

.logo span {
    color: #4f46e5;
}

.sidebar-title {
    font-size: 13px;
    color: #777;
    margin: 8px 8px;
}

.subject-list {
    flex: 1;
    overflow-y: auto;
}

.subject-item {
    width: 100%;
    padding: 11px 12px;
    margin-bottom: 4px;
    border-radius: 9px;
    background: transparent;
    text-align: left;
    color: #333;
}

.subject-item:hover {
    background: #f1f3f7;
}

.subject-item.active {
    background: #eef2ff;
    color: #4338ca;
    font-weight: 700;
}

.add-subject {
    margin-top: 12px;
    padding: 11px;
    border-radius: 9px;
    background: #4f46e5;
    color: white;
    font-weight: 700;
}

/* 메인 */
.main {
    flex: 1;
    min-width: 0;
    padding: 28px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}

.header h1 {
    margin: 0;
    font-size: 26px;
}

.header-actions {
    display: flex;
    gap: 8px;
}

.btn {
    padding: 10px 15px;
    border-radius: 8px;
    background: white;
    border: 1px solid #ddd;
}

.btn:hover {
    background: #f7f7f7;
}

.btn.primary {
    background: #4f46e5;
    color: white;
    border-color: #4f46e5;
}

.btn.danger {
    color: #dc2626;
}

/* 카드 */
.card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 20px;
}

.card-title {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 18px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
}

.form-group label {
    display: block;
    font-size: 13px;
    color: #666;
    margin-bottom: 6px;
}

.form-group input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d9dce3;
    border-radius: 8px;
    outline: none;
}

.form-group input:focus {
    border-color: #4f46e5;
}

.create-row {
    margin-top: 18px;
    display: flex;
    justify-content: flex-end;
}

/* 통계 */
.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.stat {
    padding: 17px;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    background: #fafafa;
}

.stat-label {
    font-size: 13px;
    color: #777;
}

.stat-value {
    font-size: 23px;
    font-weight: 800;
    margin-top: 5px;
}

/* 채점표 */
.table-wrap {
    overflow-x: auto;
}

.score-table {
    width: 100%;
    border-collapse: collapse;
}

.score-table th,
.score-table td {
    border-bottom: 1px solid #e8e8e8;
    padding: 9px 8px;
    text-align: center;
}

.score-table th {
    background: #f7f8fa;
    font-size: 13px;
}

.score-table input,
.score-table select {
    width: 100%;
    padding: 7px;
    border: 1px solid #ddd;
    border-radius: 6px;
    text-align: center;
}

.correct {
    color: #16a34a;
    font-weight: 800;
}

.wrong {
    color: #dc2626;
    font-weight: 800;
}

.empty {
    text-align: center;
    padding: 80px 20px;
    color: #777;
}

/* 모달 */
.modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.modal-bg.show {
    display: flex;
}

.modal {
    width: 420px;
    max-width: calc(100vw - 30px);
    background: white;
    border-radius: 15px;
    padding: 24px;
}

.modal h2 {
    margin-top: 0;
}

.modal input {
    width: 100%;
    padding: 11px;
    border: 1px solid #ddd;
    border-radius: 8px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
}

.notice {
    padding: 12px 15px;
    background: #eef2ff;
    color: #3730a3;
    border-radius: 9px;
    margin-bottom: 18px;
    font-size: 14px;
}

@media (max-width: 900px) {
    .sidebar {
        width: 190px;
    }

    .form-grid,
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 650px) {
    .app {
        display: block;
    }

    .sidebar {
        width: 100%;
        border-right: 0;
        border-bottom: 1px solid #ddd;
    }

    .main {
        padding: 16px;
    }

    .header {
        display: block;
    }

    .header-actions {
        margin-top: 12px;
        flex-wrap: wrap;
    }

    .form-grid,
    .stats {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <div class="logo">가<span>채점</span></div>

        <div class="sidebar-title">과목</div>

        <div id="subjectList" class="subject-list"></div>

        <button class="add-subject" onclick="openSubjectModal()">
            + 과목 추가
        </button>
    </aside>

    <main class="main">

        <header class="header">
            <div>
                <h1 id="pageTitle">가채점</h1>
            </div>

            <div class="header-actions">
                <button class="btn" onclick="exportBackup()">
                    데이터 내보내기
                </button>

                <button class="btn" onclick="document.getElementById('importFile').click()">
                    데이터 가져오기
                </button>

                <button class="btn primary" onclick="exportExcel()">
                    Excel 내보내기
                </button>

                <input
                    id="importFile"
                    type="file"
                    accept=".json"
                    style="display:none"
                    onchange="importBackup(event)"
                >
            </div>
        </header>

        <div id="content"></div>

    </main>
</div>

<!-- 과목 추가 모달 -->
<div id="subjectModal" class="modal-bg">
    <div class="modal">
        <h2>과목 추가</h2>

        <input
            id="subjectName"
            type="text"
            placeholder="예: 국어"
            onkeydown="if(event.key==='Enter') addSubject()"
        >

        <div class="modal-actions">
            <button class="btn" onclick="closeSubjectModal()">취소</button>
            <button class="btn primary" onclick="addSubject()">추가</button>
        </div>
    </div>
</div>

<script>
/* =========================================================
   데이터
========================================================= */

const STORAGE_KEY = "ga_chaejum_v1";

let data = loadData();
let currentSubjectId = null;
let currentExamId = null;


/* =========================================================
   초기 데이터
========================================================= */

function createInitialData() {
    return {
        version: 1,
        subjects: []
    };
}

function loadData() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) {
            return createInitialData();
        }

        const parsed = JSON.parse(saved);

        if (!parsed.subjects) {
            parsed.subjects = [];
        }

        return parsed;

    } catch (error) {
        console.error(error);
        return createInitialData();
    }
}

function saveData() {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );
}


/* =========================================================
   ID
========================================================= */

function createId() {
    return Date.now().toString(36) +
        Math.random().toString(36).substring(2, 8);
}


/* =========================================================
   사이드바
========================================================= */

function renderSubjects() {

    const list = document.getElementById("subjectList");

    list.innerHTML = "";

    if (data.subjects.length === 0) {
        list.innerHTML = `
            <div style="padding:10px;color:#888;font-size:13px;">
                과목이 없습니다.
            </div>
        `;
        return;
    }

    data.subjects.forEach(subject => {

        const button = document.createElement("button");

        button.className =
            "subject-item " +
            (subject.id === currentSubjectId ? "active" : "");

        button.textContent = subject.name;

        button.onclick = () => {
            currentSubjectId = subject.id;
            currentExamId = null;

            renderSubjects();
            renderContent();
        };

        list.appendChild(button);
    });
}


/* =========================================================
   과목 모달
========================================================= */

function openSubjectModal() {
    document.getElementById("subjectModal").classList.add("show");

    setTimeout(() => {
        document.getElementById("subjectName").focus();
    }, 50);
}

function closeSubjectModal() {
    document.getElementById("subjectModal").classList.remove("show");
    document.getElementById("subjectName").value = "";
}

function addSubject() {

    const input = document.getElementById("subjectName");
    const name = input.value.trim();

    if (!name) {
        alert("과목명을 입력해주세요.");
        return;
    }

    const subject = {
        id: createId(),
        name: name,
        exams: []
    };

    data.subjects.push(subject);

    currentSubjectId = subject.id;
    currentExamId = null;

    saveData();

    closeSubjectModal();
    renderSubjects();
    renderContent();
}


/* =========================================================
   현재 과목
========================================================= */

function getCurrentSubject() {

    return data.subjects.find(
        subject => subject.id === currentSubjectId
    );
}

function getCurrentExam() {

    const subject = getCurrentSubject();

    if (!subject) return null;

    return subject.exams.find(
        exam => exam.id === currentExamId
    );
}


/* =========================================================
   메인 화면
========================================================= */

function renderContent() {

    const content = document.getElementById("content");

    const subject = getCurrentSubject();

    if (!subject) {

        document.getElementById("pageTitle").textContent = "가채점";

        content.innerHTML = `
            <div class="card empty">
                <h2>가채점 서비스를 시작해보세요.</h2>
                <p>왼쪽에서 과목을 추가한 후 시험을 생성할 수 있습니다.</p>
                <button class="btn primary" onclick="openSubjectModal()">
                    + 첫 과목 추가
                </button>
            </div>
        `;

        return;
    }

    document.getElementById("pageTitle").textContent =
        subject.name;

    const exam = getCurrentExam();

    if (!exam) {

        content.innerHTML = `
            <div class="card">

                <div class="card-title">
                    새 시험 만들기
                </div>

                <div class="notice">
                    객관식과 서·논술형 문항 수를 입력하면
                    자동으로 채점표가 생성됩니다.
                </div>

                <div class="form-grid">

                    <div class="form-group">
                        <label>시험명</label>
                        <input
                            id="examName"
                            placeholder="예: 1학기 중간고사"
                        >
                    </div>

                    <div class="form-group">
                        <label>객관식 문항 수</label>
                        <input
                            id="objectiveCount"
                            type="number"
                            min="0"
                            value="20"
                        >
                    </div>

                    <div class="form-group">
                        <label>서·논술형 문항 수</label>
                        <input
                            id="subjectiveCount"
                            type="number"
                            min="0"
                            value="0"
                        >
                    </div>

                    <div class="form-group">
                        <label>학생명</label>
                        <input
                            id="studentName"
                            placeholder="선택 입력"
                        >
                    </div>

                </div>

                <div class="create-row">
                    <button
                        class="btn primary"
                        onclick="createExam()"
                    >
                        채점표 생성
                    </button>
                </div>

            </div>

            <div class="card">

                <div class="card-title">
                    ${escapeHtml(subject.name)}의 시험
                </div>

                ${renderExamList(subject)}

            </div>
        `;

        return;
    }

    renderExam(exam);
}


/* =========================================================
   시험 목록
========================================================= */

function renderExamList(subject) {

    if (subject.exams.length === 0) {
        return `
            <div style="color:#888;">
                아직 생성된 시험이 없습니다.
            </div>
        `;
    }

    return subject.exams.map(exam => {

        const score = calculateExam(exam);

        return `
            <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                padding:14px 0;
                border-bottom:1px solid #eee;
            ">

                <div>
                    <strong>${escapeHtml(exam.name)}</strong>
                    <div style="font-size:13px;color:#888;margin-top:4px;">
                        ${score.totalScore} / ${score.totalPossible}
                    </div>
                </div>

                <div>
                    <button
                        class="btn"
                        onclick="openExam('${exam.id}')"
                    >
                        열기
                    </button>

                    <button
                        class="btn danger"
                        onclick="deleteExam('${exam.id}')"
                    >
                        삭제
                    </button>
                </div>

            </div>
        `;

    }).join("");
}


/* =========================================================
   시험 생성
========================================================= */

function createExam() {

    const subject = getCurrentSubject();

    const name =
        document.getElementById("examName").value.trim()
        || "새 시험";

    const objectiveCount =
        Math.max(
            0,
            parseInt(
                document.getElementById("objectiveCount").value
            ) || 0
        );

    const subjectiveCount =
        Math.max(
            0,
            parseInt(
                document.getElementById("subjectiveCount").value
            ) || 0
        );

    const studentName =
        document.getElementById("studentName").value.trim();

    if (objectiveCount + subjectiveCount === 0) {
        alert("문항 수를 하나 이상 입력해주세요.");
        return;
    }

    const exam = {
        id: createId(),
        name: name,
        studentName: studentName,
        createdAt: new Date().toISOString(),

        objective: [],
        subjective: []
    };

    for (let i = 1; i <= objectiveCount; i++) {

        exam.objective.push({
            number: i,
            answer: "",
            studentAnswer: "",
            points: 0
        });

    }

    for (let i = 1; i <= subjectiveCount; i++) {

        exam.subjective.push({
            number: objectiveCount + i,
            result: "",
            points: 0,
            score: 0
        });

    }

    subject.exams.push(exam);

    currentExamId = exam.id;

    saveData();
    renderContent();
}


/* =========================================================
   시험 열기
========================================================= */

function openExam(id) {

    currentExamId = id;

    renderContent();
}


/* =========================================================
   시험 삭제
========================================================= */

function deleteExam(id) {

    if (!confirm("이 시험을 삭제할까요?")) {
        return;
    }

    const subject = getCurrentSubject();

    subject.exams =
        subject.exams.filter(exam => exam.id !== id);

    currentExamId = null;

    saveData();
    renderContent();
}


/* =========================================================
   채점표
========================================================= */

function renderExam(exam) {

    const content = document.getElementById("content");

    const score = calculateExam(exam);

    content.innerHTML = `

        <div class="card">

            <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:10px;
                flex-wrap:wrap;
            ">

                <div>
                    <div style="font-size:22px;font-weight:800;">
                        ${escapeHtml(exam.name)}
                    </div>

                    <div style="color:#777;margin-top:5px;">
                        ${exam.studentName
                            ? "학생: " + escapeHtml(exam.studentName)
                            : ""}
                    </div>
                </div>

                <div style="display:flex;gap:8px;">
                    <button
                        class="btn"
                        onclick="backToExamList()"
                    >
                        시험 목록
                    </button>

                    <button
                        class="btn primary"
                        onclick="exportCurrentSubjectExcel()"
                    >
                        이 과목 Excel
                    </button>
                </div>

            </div>

        </div>


        <div class="stats">

            <div class="stat">
                <div class="stat-label">객관식</div>
                <div class="stat-value">
                    ${score.objectiveScore} /
                    ${score.objectivePossible}
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">서·논술형</div>
                <div class="stat-value">
                    ${score.subjectiveScore} /
                    ${score.subjectivePossible}
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">총점</div>
                <div class="stat-value">
                    ${score.totalScore} /
                    ${score.totalPossible}
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">획득률</div>
                <div class="stat-value">
                    ${score.percent}%
                </div>
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                객관식
            </div>

            ${
                exam.objective.length
                    ? renderObjectiveTable(exam)
                    : `<div style="color:#888;">객관식 문항이 없습니다.</div>`
            }

        </div>


        <div class="card">

            <div class="card-title">
                서·논술형
            </div>

            ${
                exam.subjective.length
                    ? renderSubjectiveTable(exam)
                    : `<div style="color:#888;">서·논술형 문항이 없습니다.</div>`
            }

        </div>
    `;
}


/* =========================================================
   객관식 표
========================================================= */

function renderObjectiveTable(exam) {

    return `
        <div class="table-wrap">

            <table class="score-table">

                <thead>
                    <tr>
                        <th>문항</th>
                        <th>정답</th>
                        <th>학생 정답</th>
                        <th>배점</th>
                        <th>정오</th>
                        <th>득점</th>
                    </tr>
                </thead>

                <tbody>

                ${exam.objective.map((q, index) => {

                    const answer =
                        normalizeAnswer(q.answer);

                    const student =
                        normalizeAnswer(q.studentAnswer);

                    const hasBoth =
                        answer !== "" && student !== "";

                    const correct =
                        hasBoth && answer === student;

                    const earned =
                        correct
                            ? Number(q.points) || 0
                            : 0;

                    return `
                        <tr>

                            <td>${q.number}</td>

                            <td>
                                <input
                                    value="${escapeAttr(q.answer)}"
                                    placeholder="①"
                                    onchange="updateObjective(${index}, 'answer', this.value)"
                                >
                            </td>

                            <td>
                                <input
                                    value="${escapeAttr(q.studentAnswer)}"
                                    placeholder="①"
                                    onchange="updateObjective(${index}, 'studentAnswer', this.value)"
                                >
                            </td>

                            <td>
                                <input
                                    type="number"
                                    min="0"
                                    step="0.01"
                                    value="${q.points}"
                                    onchange="updateObjective(${index}, 'points', this.value)"
                                >
                            </td>

                            <td class="${correct ? "correct" : "wrong"}">
                                ${
                                    !hasBoth
                                        ? "-"
                                        : correct
                                            ? "O"
                                            : "X"
                                }
                            </td>

                            <td>
                                <strong>${earned}</strong>
                            </td>

                        </tr>
                    `;

                }).join("")}

                </tbody>

            </table>

        </div>
    `;
}


/* =========================================================
   서논술형 표
========================================================= */

function renderSubjectiveTable(exam) {

    return `
        <div class="table-wrap">

            <table class="score-table">

                <thead>
                    <tr>
                        <th>문항</th>
                        <th>정오 여부</th>
                        <th>배점</th>
                        <th>득점</th>
                    </tr>
                </thead>

                <tbody>

                ${exam.subjective.map((q, index) => {

                    return `
                        <tr>

                            <td>${q.number}</td>

                            <td>
                                <select
                                    onchange="updateSubjective(${index}, 'result', this.value)"
                                >
                                    <option value=""
                                        ${q.result === "" ? "selected" : ""}>
                                        미채점
                                    </option>

                                    <option value="O"
                                        ${q.result === "O" ? "selected" : ""}>
                                        O
                                    </option>

                                    <option value="X"
                                        ${q.result === "X" ? "selected" : ""}>
                                        X
                                    </option>

                                    <option value="부분정답"
                                        ${q.result === "부분정답" ? "selected" : ""}>
                                        부분정답
                                    </option>
                                </select>
                            </td>

                            <td>
                                <input
                                    type="number"
                                    min="0"
                                    step="0.01"
                                    value="${q.points}"
                                    onchange="updateSubjective(${index}, 'points', this.value)"
                                >
                            </td>

                            <td>
                                <input
                                    type="number"
                                    min="0"
                                    step="0.01"
                                    value="${q.score}"
                                    onchange="updateSubjective(${index}, 'score', this.value)"
                                >
                            </td>

                        </tr>
                    `;

                }).join("")}

                </tbody>

            </table>

        </div>
    `;
}


/* =========================================================
   객관식 데이터 변경
========================================================= */

function updateObjective(index, field, value) {

    const exam = getCurrentExam();

    if (!exam) return;

    if (field === "points") {
        value = Math.max(0, Number(value) || 0);
    }

    exam.objective[index][field] = value;

    saveData();

    renderExam(exam);
}


/* =========================================================
   서논술형 데이터 변경
========================================================= */

function updateSubjective(index, field, value) {

    const exam = getCurrentExam();

    if (!exam) return;

    if (field === "points" || field === "score") {
        value = Math.max(0, Number(value) || 0);
    }

    exam.subjective[index][field] = value;

    saveData();

    renderExam(exam);
}


/* =========================================================
   점수 계산
========================================================= */

function calculateExam(exam) {

    let objectiveScore = 0;
    let objectivePossible = 0;

    exam.objective.forEach(q => {

        const answer =
            normalizeAnswer(q.answer);

        const student =
            normalizeAnswer(q.studentAnswer);

        const points =
            Number(q.points) || 0;

        objectivePossible += points;

        if (
            answer !== "" &&
            student !== "" &&
            answer === student
        ) {
            objectiveScore += points;
        }
    });


    let subjectiveScore = 0;
    let subjectivePossible = 0;

    exam.subjective.forEach(q => {

        subjectivePossible += Number(q.points) || 0;
        subjectiveScore += Number(q.score) || 0;

    });


    const totalScore =
        objectiveScore + subjectiveScore;

    const totalPossible =
        objectivePossible + subjectivePossible;

    const percent =
        totalPossible > 0
            ? Math.round(
                (totalScore / totalPossible) * 10000
            ) / 100
            : 0;

    return {
        objectiveScore,
        objectivePossible,
        subjectiveScore,
        subjectivePossible,
        totalScore,
        totalPossible,
        percent
    };
}


/* =========================================================
   정답 정규화
========================================================= */

function normalizeAnswer(value) {

    return String(value || "")
        .trim()
        .replace(/\s+/g, "")
        .replace(/[①]/g, "1")
        .replace(/[②]/g, "2")
        .replace(/[③]/g, "3")
        .replace(/[④]/g, "4")
        .replace(/[⑤]/g, "5")
        .toLowerCase();
}

/* =========================================================
   JSON 복원
========================================================= */

function importBackup(event) {

    const file =
        event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

        try {

            const imported =
                JSON.parse(e.target.result);

            if (
                !imported ||
                !Array.isArray(imported.subjects)
            ) {
                throw new Error("잘못된 파일");
            }

            const overwrite =
                confirm(
                    "현재 데이터를 가져온 데이터로 교체할까요?\n\n" +
                    "취소를 누르면 현재 데이터에 과목을 추가합니다."
                );

            if (overwrite) {

                data = imported;

            } else {

                imported.subjects.forEach(subject => {

                    const existing =
                        data.subjects.find(
                            s => s.name === subject.name
                        );

                    if (existing) {

                        existing.exams.push(
                            ...(subject.exams || [])
                        );

                    } else {

                        data.subjects.push(subject);

                    }

                });
            }

            saveData();

            currentSubjectId = null;
            currentExamId = null;

            renderSubjects();
            renderContent();

            alert("데이터를 가져왔습니다.");

        } catch (error) {

            console.error(error);

            alert(
                "가져오기에 실패했습니다.\n" +
                "올바른 가채점 백업 파일인지 확인해주세요."
            );
        }

        event.target.value = "";
    };

    reader.readAsText(file);
}


/* =========================================================
   Excel 전체 내보내기
========================================================= */

function exportExcel() {

    if (!window.XLSX) {
        alert(
            "Excel 라이브러리를 불러오지 못했습니다.\n" +
            "인터넷 연결을 확인해주세요."
        );
        return;
    }

    if (data.subjects.length === 0) {
        alert("내보낼 과목이 없습니다.");
        return;
    }

    const workbook =
        XLSX.utils.book_new();

    data.subjects.forEach(subject => {

        if (!subject.exams.length) {

            const ws =
                XLSX.utils.aoa_to_sheet([
                    [subject.name],
                    [],
                    ["시험이 없습니다."]
                ]);

            setupWorksheet(ws);

            XLSX.utils.book_append_sheet(
                workbook,
                ws,
                safeSheetName(subject.name)
            );

            return;
        }

        /*
         * 한 과목에 여러 시험이 있을 경우
         * 해당 과목 시트 안에 시험들을 이어서 표시
         */
        const rows = [];

        subject.exams.forEach((exam, examIndex) => {

            const score =
                calculateExam(exam);

            rows.push([
                subject.name +
                " - " +
                exam.name
            ]);

            rows.push([
                "학생명",
                exam.studentName || ""
            ]);

            rows.push([]);

            rows.push([
                "문항",
                "유형",
                "정답",
                "학생 정답",
                "정오",
                "배점",
                "득점"
            ]);

            exam.objective.forEach(q => {

                const answer =
                    normalizeAnswer(q.answer);

                const student =
                    normalizeAnswer(q.studentAnswer);

                const answered =
                    answer !== "" &&
                    student !== "";

                const correct =
                    answered &&
                    answer === student;

                rows.push([
                    q.number,
                    "객관식",
                    q.answer,
                    q.studentAnswer,
                    answered
                        ? correct ? "O" : "X"
                        : "",
                    Number(q.points) || 0,
                    correct
                        ? Number(q.points) || 0
                        : 0
                ]);

            });

            exam.subjective.forEach(q => {

                rows.push([
                    q.number,
                    "서·논술형",
                    "",
                    "",
                    q.result,
                    Number(q.points) || 0,
                    Number(q.score) || 0
                ]);

            });

            rows.push([]);

            rows.push([
                "객관식 점수",
                score.objectiveScore,
                "/",
                score.objectivePossible
            ]);

            rows.push([
                "서·논술형 점수",
                score.subjectiveScore,
                "/",
                score.subjectivePossible
            ]);

            rows.push([
                "총점",
                score.totalScore,
                "/",
                score.totalPossible
            ]);

            rows.push([
                "획득률",
                score.percent + "%"
            ]);

            if (examIndex !== subject.exams.length - 1) {
                rows.push([]);
                rows.push([]);
            }

        });

        const ws =
            XLSX.utils.aoa_to_sheet(rows);

        styleWorksheet(ws);

        XLSX.utils.book_append_sheet(
            workbook,
            ws,
            safeSheetName(subject.name)
        );
    });


    /*
     * Excel 인쇄 설정
     */
    workbook.SheetNames.forEach(sheetName => {

        const ws =
            workbook.Sheets[sheetName];

        setupWorksheet(ws);

    });


    XLSX.writeFile(
        workbook,
        "가채점_결과.xlsx"
    );
}

/* =========================================================
   Excel 스타일
========================================================= */

function styleWorksheet(ws) {

    ws["!cols"] = [
        { wch: 8 },
        { wch: 14 },
        { wch: 14 },
        { wch: 14 },
        { wch: 10 },
        { wch: 10 },
        { wch: 10 }
    ];

    /*
     * SheetJS Community Edition에서는
     * 셀 스타일 지원이 제한될 수 있음.
     * 기본적인 열 너비와 인쇄 설정은 적용.
     */
}


/* =========================================================
   Excel 페이지 설정
========================================================= */

function setupWorksheet(ws) {

    ws["!pageSetup"] = {
        paperSize: "9",
        orientation: "landscape",
        fitToWidth: 1,
        fitToHeight: 1
    };

    ws["!margins"] = {
        left: 0.25,
        right: 0.25,
        top: 0.5,
        bottom: 0.5,
        header: 0.2,
        footer: 0.2
    };

    ws["!printOptions"] = {
        horizontalCentered: true,
        verticalCentered: false
    };
}


/* =========================================================
   Sheet 이름
========================================================= */

function safeSheetName(name) {

    let result =
        String(name)
            .replace(/[\\\/\?\*\[\]\:]/g, "_")
            .substring(0, 31);

    return result || "과목";
}


/* =========================================================
   다운로드
========================================================= */

function downloadBlob(
    content,
    filename,
    type
) {

    const blob =
        new Blob(
            [content],
            { type }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download = filename;

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);
}


/* =========================================================
   HTML 보안
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escapeAttr(value) {
    return escapeHtml(value);
}
